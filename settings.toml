# -------------------------------------------------------
# Draft pipeline settings
# Edit this file — all scripts read it.
# -------------------------------------------------------

[mesh]
input_file         = "../Assembly2.stl"
output_file        = "output.stl"
reconstruct_input  = "output.stl"    # input to rebuild.py (defaults to output_file)
reconstruct_output = "rebuilt_assembly2.stl"   # final reconstructed mesh

[voxel]
voxel_size      = 0.1  # mm per voxel
draft_angle_deg = 6    # degrees of draft
pad             = 8    # voxel padding (fallback if running worker directly)

[tiling]
tile_size   = 15.0  # XY tile size in mm
overlap     = 5.0   # overlap in mm (fallback — controller auto-computes from mesh height)
max_workers = 6     # parallel worker processes

[combine]
batch_size             = 16
max_tile_faces         = 200000   # decimate each input tile to this before boolean (0 = skip)
max_intermediate_faces = 0        # decimate combined intermediates above this (0 = disabled — breaks volume)
final_face_count       = 10000000        # decimate final output (0 = skip — let Poisson handle it)

[paths]
tiles_dir       = "tiles"
processed_dir   = "processed"
reduced_dir     = "reduced"
debug_dir       = "debug_combine"
worker_script   = "./worker.py"
merge_script    = "./merge_coplanar.py"
combiner_script = "./combiner.py"
rebuild_script  = "./rebuild.py"
tile_cache    = "tile_cache.json"  # hash cache for fast watertight checks

[reconstruct]
point_count          = 1000000  # points sampled from mesh for Poisson
poisson_depth        = 10       # 8=smoother, 9=balanced, 10=more detail
in_input_quality     = 1        # skip reconstruction if input not watertight (0 = always run)

# Post-reconstruction smoothing (replaces old Taubin pass)
# Feature-adaptive Laplacian: smooths flat/stair-step regions, pins sharp edges
fa_laplacian_angle   = 45   # dihedral threshold in degrees — edges sharper than this are preserved
fa_laplacian_iters   = 30   # FA-Laplacian iteration count
# Boundary-aware Laplacian polish: light pass that pins open boundary vertices to prevent spikes
boundary_lap_iters   = 5    # set to 0 to skip
pin_bottom_z_thresh  = 0.5  # mm above z_min to pin during smoothing (0 = disabled)
